name: Mise à jour des tirages EuroMillions

on:
  schedule:
    - cron: '00 19 * * 2,5'   # 21h00 heure française (UTC+2 été)
    - cron: '30 19 * * 2,5'   # 21h30
    - cron: '00 20 * * 2,5'   # 22h00
    - cron: '30 20 * * 2,5'   # 22h30
    - cron: '00 21 * * 2,5'   # 23h00
    - cron: '30 21 * * 2,5'   # 23h30
    - cron: '00 22 * * 2,5'   # 00h00
    - cron: '30 22 * * 2,5'   # 00h30
    - cron: '00 23 * * 3,6'   # 01h00 (mercredi/samedi)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Récupérer les derniers tirages
        run: |
          python3 - << 'PYEOF'
          import urllib.request
          import json
          from datetime import datetime

          try:
            # On récupère les 5 derniers tirages triés du plus récent au plus ancien
            url = "https://euromillions.api.pedromealha.dev/v1/draws?limit=5&order=desc"
            req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
            with urllib.request.urlopen(req, timeout=10) as r:
              data = json.loads(r.read())
          except Exception as e:
            print(f"Erreur API: {e}")
            exit(0)

          draws = data if isinstance(data, list) else data.get("draws", [])
          if not draws:
            print("Aucun tirage reçu")
            exit(0)

          # Trie par date décroissante au cas où l'API ne le fait pas
          def parse_date(d):
            try:
              return datetime.strptime(d.get("date","1900-01-01"), "%Y-%m-%d")
            except:
              return datetime.min

          draws = sorted(draws, key=parse_date, reverse=True)

          new_entries = []
          for d in draws[:3]:
            try:
              date_str = datetime.strptime(d["date"], "%Y-%m-%d").strftime("%d/%m/%Y")
              # Force les numéros en entiers
              nums = [int(n) for n in d.get("numbers", [])]
              stars = [int(s) for s in d.get("stars", d.get("luckyStars", []))]
              if len(nums) == 5 and len(stars) == 2:
                entry = f'  {{ date: "{date_str}", numbers: {nums}, stars: {stars} }}'
                new_entries.append(entry)
            except Exception as e:
              print(f"Erreur entrée: {e}")
              continue

          if not new_entries:
            print("Aucune entrée valide")
            exit(0)

          with open("data.js", "r", encoding="utf-8") as f:
            content = f.read()

          # Anti-doublon : si la date la plus récente est déjà là on arrête
          first_date = new_entries[0].split('"')[1] if new_entries else ""
          if first_date and first_date in content:
            print(f"Tirage du {first_date} déjà présent, rien à faire")
            exit(0)

          marker = "const RECENT_DRAWS = ["
          idx = content.find(marker)
          if idx == -1:
            print("Marqueur non trouvé")
            exit(0)

          insert_pos = idx + len(marker) + 1
          new_block = "\n".join(new_entries) + ",\n"
          new_content = content[:insert_pos] + new_block + content[insert_pos:]

          with open("data.js", "w", encoding="utf-8") as f:
            f.write(new_content)

          print(f"✅ {len(new_entries)} tirage(s) ajouté(s) — {first_date}")
          PYEOF

      - name: Commit et push si changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --staged --quiet || git commit -m "🎰 Nouveau tirage ajouté automatiquement"
          git push
