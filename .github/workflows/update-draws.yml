name: Mise à jour des tirages EuroMillions

on:
  schedule:
    - cron: '30 21 * * 2'   # Mardi 21h30 UTC (22h30 heure française)
    - cron: '30 21 * * 5'   # Vendredi 21h30 UTC (22h30 heure française)
  workflow_dispatch:          # Permet aussi de lancer manuellement

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Récupérer les derniers tirages
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import re
          from datetime import datetime

          # Récupère les 10 derniers tirages depuis l'API
          try:
            url = "https://euromillions.api.pedromealha.dev/v1/draws?limit=10"
            req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
            with urllib.request.urlopen(req, timeout=10) as r:
              data = json.loads(r.read())
          except Exception as e:
            print(f"Erreur API: {e}")
            exit(0)

          draws = data if isinstance(data, list) else data.get("draws", [])
          if not draws:
            print("Aucun tirage reçu")
            exit(0)

          # Convertit en format JS
          new_entries = []
          for d in draws[:5]:
            try:
              date_str = datetime.strptime(d["date"], "%Y-%m-%d").strftime("%d/%m/%Y")
              nums = d.get("numbers", [])
              stars = d.get("stars", d.get("luckyStars", []))
              if len(nums) == 5 and len(stars) == 2:
                entry = f'  {{ date: "{date_str}", numbers: {nums}, stars: {stars} }}'
                new_entries.append(entry)
            except:
              continue

          if not new_entries:
            print("Aucune entrée valide")
            exit(0)

          # Lit data.js
          with open("data.js", "r", encoding="utf-8") as f:
            content = f.read()

          # Trouve le début du tableau RECENT_DRAWS et insère les nouvelles entrées
          marker = "const RECENT_DRAWS = ["
          idx = content.find(marker)
          if idx == -1:
            print("Marqueur non trouvé")
            exit(0)

          insert_pos = idx + len(marker) + 1
          new_block = "\n".join(new_entries) + ",\n"

          # Vérifie si la date la plus récente est déjà là (anti-doublon)
          first_date = new_entries[0].split('"')[1] if new_entries else ""
          if first_date and first_date in content:
            print(f"Tirage du {first_date} déjà présent, pas de mise à jour")
            exit(0)

          new_content = content[:insert_pos] + new_block + content[insert_pos:]

          with open("data.js", "w", encoding="utf-8") as f:
            f.write(new_content)

          print(f"✅ {len(new_entries)} tirage(s) ajouté(s)")
          EOF

      - name: Commit et push si changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --staged --quiet || git commit -m "🎰 Mise à jour automatique des tirages"
          git push
